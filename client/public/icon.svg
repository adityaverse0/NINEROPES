<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a28"/>
      <stop offset="100%" stop-color="#161615"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea7a53"/>
      <stop offset="45%" stop-color="#c96442"/>
      <stop offset="100%" stop-color="#9e4324"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#ded8c4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#c96442" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#3d3d38" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Subtle Film Sprocket Strip on Sides -->
  <g fill="#333330" opacity="0.6">
    <rect x="24" y="80" width="20" height="28" rx="6"/>
    <rect x="24" y="140" width="20" height="28" rx="6"/>
    <rect x="24" y="200" width="20" height="28" rx="6"/>
    <rect x="24" y="260" width="20" height="28" rx="6"/>
    <rect x="24" y="320" width="20" height="28" rx="6"/>
    <rect x="24" y="380" width="20" height="28" rx="6"/>

    <rect x="468" y="80" width="20" height="28" rx="6"/>
    <rect x="468" y="140" width="20" height="28" rx="6"/>
    <rect x="468" y="200" width="20" height="28" rx="6"/>
    <rect x="468" y="260" width="20" height="28" rx="6"/>
    <rect x="468" y="320" width="20" height="28" rx="6"/>
    <rect x="468" y="380" width="20" height="28" rx="6"/>
  </g>

  <!-- Cinema Reel / Stylized "9" Icon -->
  <g filter="url(#glow)">
    <!-- Main Reel Ring (Head of the "9") -->
    <circle cx="256" cy="206" r="114" fill="none" stroke="url(#brand)" stroke-width="36"/>

    <!-- Descender of the "9" -->
    <path d="M 370 206 C 370 310 312 396 210 404 C 182 406 160 392 160 370 C 160 350 178 344 196 342 C 266 336 312 284 326 220" 
          fill="none" stroke="url(#brand)" stroke-width="36" stroke-linecap="round"/>

    <!-- Center Reel Hub -->
    <circle cx="256" cy="206" r="42" fill="url(#brand)"/>
    <circle cx="256" cy="206" r="16" fill="#1c1c1a"/>

    <!-- Reel Apertures -->
    <circle cx="256" cy="132" r="14" fill="#1c1c1a"/>
    <circle cx="256" cy="280" r="14" fill="#1c1c1a"/>
    <circle cx="182" cy="206" r="14" fill="#1c1c1a"/>
    <circle cx="330" cy="206" r="14" fill="#1c1c1a"/>
  </g>

  <!-- Star / Sparkle Accent in top right -->
  <path d="M 390 100 Q 390 120 410 120 Q 390 120 390 140 Q 390 120 370 120 Q 390 120 390 100 Z" fill="url(#accent)"/>
</svg>
