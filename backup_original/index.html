<script>
(function(){
  var KEY="hc_banner_x", DAY=864e5, H=0;
  try{ var t=localStorage.getItem(KEY); if(t && Date.now()-(+t)<DAY){ var e0=document.getElementById("hc-topbanner"); if(e0) e0.remove(); return; } }catch(e){}
  var b=document.getElementById("hc-topbanner"); if(!b) return;
  function apply(){
    if(b.style.display==="none") return;
    H=b.offsetHeight||52;
    var all=document.getElementsByTagName("*"), i, el, s;
    for(i=0;i<all.length;i++){ el=all[i]; if(el===b||b.contains(el)) continue;
      s=getComputedStyle(el);
      if((s.position==="fixed"||s.position==="sticky") && Math.abs(parseInt(s.top)||0)<2){ el.style.top=H+"px"; }
    }
    document.body.style.paddingTop=H+"px";
  }
  function revert(){
    document.body.style.paddingTop="";
    var all=document.getElementsByTagName("*"), i, el;
    for(i=0;i<all.length;i++){ el=all[i]; if(el===b) continue;
      if(el.style && el.style.top && Math.abs((parseInt(el.style.top)||0)-Math.round(H))<2){ el.style.top=""; } }
  }
  b.querySelector(".hc-tb-x").addEventListener("click",function(){ b.style.display="none"; revert(); try{localStorage.setItem(KEY,Date.now())}catch(e){} if(obs) obs.disconnect(); });
  // SPA renders its sticky header/fixed layers after this runs — apply at a few points + on DOM changes
  [0,300,800,1500,3000].forEach(function(ms){ setTimeout(apply,ms); });
  var obs=null, deb; try{ obs=new MutationObserver(function(){ clearTimeout(deb); deb=setTimeout(apply,150); }); obs.observe(document.body,{childList:true,subtree:true}); setTimeout(function(){ if(obs) obs.disconnect(); },5000); }catch(e){}
  window.addEventListener("resize", apply);
})();
</script>

<script>
(function(){
  var B="https://wavestream.cc/b/wavestream-";
  function make(){
    var a=document.createElement("a");
    a.id="ws-banner"; a.href="https://wavestream.cc/?ref=hicine"; a.target="_blank"; a.rel="noopener";
    a.setAttribute("aria-label","WaveStream – stream everything, free. Get the app");
    a.innerHTML='<picture><source media="(max-width: 600px)" srcset="'+B+'320x100.jpg 1x, '+B+'320x100-2x.jpg 2x" width="320" height="100">'+
      '<img src="'+B+'728x90.jpg" srcset="'+B+'728x90-2x.jpg 2x" width="728" height="90" alt="WaveStream – Stream everything. Free." decoding="async"></picture>';
    a.addEventListener("click",function(){try{window.gtag&&gtag("event","promo_click",{promo:"wavestream",content_type:"home"})}catch(e){}});
    return a;
  }
  var el=null, queued=false;
  function place(){
    queued=false;
    // the app keeps "/" for every tab, so the Home tab is told apart by its page heading
    var root=document.querySelector("div.min-h-screen.bg-black"), h1=document.querySelector("main h1"),
        home=location.pathname==="/"&&!!h1&&h1.textContent.trim()==="Home";
    if(!root||!home){ if(el&&el.parentNode) el.parentNode.removeChild(el); return; }
    var head=null, tg=null;
    for(var i=0;i<root.children.length;i++){
      var c=root.children[i];
      if(c.tagName==="HEADER") head=c;
      else if(!tg && c.id!=="ws-banner" && /^Join Telegram/.test((c.textContent||"").trim())) tg=c;
    }
    var before=tg||(head&&head.nextElementSibling&&head.nextElementSibling.nextElementSibling);
    if(!before) return;
    if(!el) el=make();
    if(el.parentNode!==root||el.nextElementSibling!==before) root.insertBefore(el,before);
  }
  function soon(){ if(!queued){ queued=true; requestAnimationFrame(place); } }
  new MutationObserver(soon).observe(document.body,{childList:true,subtree:true});
  window.addEventListener("popstate",soon);
  soon();
})();
</script>
